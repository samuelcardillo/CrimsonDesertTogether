# Builds the mod from this repository and publishes it as a release, so that players only press "Update" in
# cdmp_launcher.exe (docs/LAUNCHER.md): the launcher reads package.txt from the newest release and downloads the
# files it lists. Nobody needs a compiler on their PC.
#
# It runs on every push to main that changes what goes into the kit, and by hand ("Run workflow" in the Actions tab).
# The tests run first: a build whose tests fail is not published. Whatever is pushed to main reaches players on their
# next Update, so push there only what both players should run.

name: Build and publish the mod

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/launcher/**'
      - 'tools/scripts/apply-guest-progress.ps1'
      - 'kit/coop/**'
      - 'third_party/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'scripts/build.ps1'
      - 'scripts/fetch_loader.ps1'
      - 'scripts/package_coop.ps1'
      - 'scripts/ci_release.ps1'
      - 'scripts/host_save_restore.ps1'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write  # to create the release and its tag

# One at a time, in order: the newest release must be the newest commit's.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # windows-2022 has Visual Studio 2022 (MSVC 14.4x), the compiler the mod is built and played with. Not
    # windows-latest: with Visual Studio 2026's compiler (14.51) a clean build fails optd_guest_save_b (2026-11-14).
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Build and run the tests
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Make the kit and publish it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci_release.ps1 -Run ${{ github.run_number }} -Attempt ${{ github.run_attempt }} -Publish
